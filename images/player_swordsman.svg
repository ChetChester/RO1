<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- 劍士角色 SVG -->
  <defs>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6fa5"/>
      <stop offset="100%" stop-color="#2c3e6b"/>
    </linearGradient>
    <linearGradient id="sword" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
  </defs>
  <!-- 頭盔 -->
  <ellipse cx="60" cy="30" rx="18" ry="20" fill="#5a7fb5"/>
  <ellipse cx="60" cy="25" rx="14" ry="12" fill="#8ab4e8"/>
  <!-- 面部 -->
  <ellipse cx="60" cy="38" rx="12" ry="10" fill="#f4c7a3"/>
  <circle cx="55" cy="36" r="2" fill="#333"/>
  <circle cx="65" cy="36" r="2" fill="#333"/>
  <path d="M56 42 Q60 45 64 42" stroke="#c0392b" fill="none" stroke-width="1.5"/>
  <!-- 身體盔甲 -->
  <rect x="40" y="50" width="40" height="45" rx="8" fill="url(#armor)"/>
  <rect x="45" y="55" width="30" height="8" rx="2" fill="#3a5a8a" opacity="0.6"/>
  <!-- 盾牌 -->
  <ellipse cx="28" cy="75" rx="14" ry="18" fill="#8b7355" stroke="#6b5335" stroke-width="2"/>
  <text x="28" y="80" text-anchor="middle" fill="#d4af37" font-size="12" font-weight="bold">⚔</text>
  <!-- 手臂 -->
  <rect x="80" y="55" width="10" height="30" rx="4" fill="#f4c7a3"/>
  <!-- 劍 -->
  <rect x="88" y="20" width="4" height="50" rx="2" fill="url(#sword)"/>
  <rect x="83" y="68" width="14" height="5" rx="2" fill="#8b7355"/>
  <circle cx="90" cy="70" r="3" fill="#d4af37"/>
  <!-- 腿 -->
  <rect x="45" y="95" width="12" height="35" rx="4" fill="#2c3e6b"/>
  <rect x="63" y="95" width="12" height="35" rx="4" fill="#2c3e6b"/>
  <!-- 靴子 -->
  <rect x="42" y="125" width="18" height="10" rx="4" fill="#4a3728"/>
  <rect x="60" y="125" width="18" height="10" rx="4" fill="#4a3728"/>
</svg>