<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- 劍士攻擊姿態 SVG -->
  <defs>
    <linearGradient id="armor2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6fa5"/>
      <stop offset="100%" stop-color="#2c3e6b"/>
    </linearGradient>
    <linearGradient id="sword2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffcc"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
  </defs>
  <!-- 頭盔 -->
  <ellipse cx="55" cy="28" rx="18" ry="20" fill="#5a7fb5"/>
  <ellipse cx="55" cy="23" rx="14" ry="12" fill="#8ab4e8"/>
  <!-- 面部 -->
  <ellipse cx="55" cy="36" rx="12" ry="10" fill="#f4c7a3"/>
  <circle cx="50" cy="34" r="2" fill="#333"/>
  <circle cx="60" cy="34" r="2" fill="#333"/>
  <path d="M51 40 Q55 43 59 40" stroke="#c0392b" fill="none" stroke-width="1.5"/>
  <!-- 身體盔甲（前傾） -->
  <rect x="35" y="48" width="40" height="45" rx="8" fill="url(#armor2)" transform="rotate(-5,55,70)"/>
  <rect x="40" y="53" width="30" height="8" rx="2" fill="#3a5a8a" opacity="0.6" transform="rotate(-5,55,70)"/>
  <!-- 盾牌 -->
  <ellipse cx="22" cy="72" rx="14" ry="18" fill="#8b7355" stroke="#6b5335" stroke-width="2"/>
  <text x="22" y="77" text-anchor="middle" fill="#d4af37" font-size="12" font-weight="bold">⚔</text>
  <!-- 手臂（揮劍） -->
  <rect x="75" y="45" width="10" height="30" rx="4" fill="#f4c7a3" transform="rotate(-20,80,60)"/>
  <!-- 劍（揮砍中） -->
  <rect x="85" y="15" width="4" height="55" rx="2" fill="url(#sword2)" transform="rotate(-30,87,40)"/>
  <rect x="80" y="65" width="14" height="5" rx="2" fill="#8b7355" transform="rotate(-30,87,67)"/>
  <circle cx="87" cy="67" r="3" fill="#d4af37"/>
  <!-- 劍氣效果 -->
  <path d="M95 30 Q110 40 105 55" stroke="#ffffaa" fill="none" stroke-width="3" opacity="0.8"/>
  <path d="M100 25 Q115 35 110 50" stroke="#ffffcc" fill="none" stroke-width="2" opacity="0.6"/>
  <!-- 腿（前衝姿勢） -->
  <rect x="40" y="93" width="12" height="35" rx="4" fill="#2c3e6b" transform="rotate(-8,46,110)"/>
  <rect x="58" y="93" width="12" height="35" rx="4" fill="#2c3e6b" transform="rotate(8,64,110)"/>
  <!-- 靴子 -->
  <rect x="36" y="123" width="18" height="10" rx="4" fill="#4a3728" transform="rotate(-8,45,128)"/>
  <rect x="56" y="123" width="18" height="10" rx="4" fill="#4a3728" transform="rotate(8,65,128)"/>
</svg>